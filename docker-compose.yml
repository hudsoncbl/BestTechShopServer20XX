version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: techshop
      POSTGRES_PASSWORD: techshop_pass
      POSTGRES_DB: techshop_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5055:80"
    depends_on:
      - postgres

volumes:
  pgdata:
